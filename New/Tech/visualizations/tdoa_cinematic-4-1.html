<style>

  #map { flex: 1; position: relative; }

  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  #controls { display: flex; gap: 8px; padding: 10px 14px; background: #0d1220; }
  .btn { flex: 1; padding: 11px 10px; border-radius: 10px; border: 1px solid #2b3a63; background: linear-gradient(#182449, #131c3a); color: #e4eaff; font-size: 13px; font-weight: 700; text-align: center; cursor: pointer; user-select: none; transition: transform .1s, background .2s; }
  .btn:active { transform: scale(0.97); background: #1c2a52; }
  #readout { padding: 12px 16px 16px; background: #0d1220; border-top: 1px solid #1c2440; font-size: 12.5px; line-height: 1.6; min-height: 74px; }
  .ok { color: #4ade80; font-weight: 700; } .bad { color: #ff6b6b; } .dim { color: #8fa0c9; }
</style>
</head>

});

function fadeLayer(layerId, prop, from, to, durationMs) {
  return new Promise(resolve => {
    const start = performance.now();
    function step(now) {
      const t = Math.min((now - start) / durationMs, 1);
      map.setPaintProperty(layerId, prop, from + (to - from) * t);
      if (t < 1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    if (lon < minLon) minLon = lon;
    if (lon > maxLon) maxLon = lon;
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
  }
  return [[minLon, minLat], [maxLon, maxLat]];
}

async function playSequence() {
  if (!mapReady) {
    readout.innerHTML = `<span class="bad">Map isn't ready yet -- wait for the button to say "Play sequence" before tapping it.</span>`;
    return;
  }
  document.getElementById('btn-play').textContent = 'Running...';
  // reset
  ['ellipse-fill','sector-fill'].forEach(id => map.setPaintProperty(id, 'fill-opacity', 0));
  ['ellipse-line','circles-line','sector-line'].forEach(id => map.setPaintProperty(id, 'line-opacity', 0));
  ['nodes-pt','est-pt'].forEach(id => { map.setPaintProperty(id, 'circle-opacity', 0); map.setPaintProperty(id, 'circle-stroke-opacity', 0); });
  map.jumpTo({ center: [78.9629, 22.5937], zoom: 3.4, pitch: 0, bearing: 0 });

  setBadge('SIGNAL RECEIVED', '');
  readout.innerHTML = `<span class="dim">Timing data received from 4 nearby network nodes.</span>`;
  await sleep(300);

  // Phase 1: flat 2D zoom into the local area -- no tilt, no rotation
  setBadge('LOCATING AREA', '');
  map.flyTo({ center: [PAYLOAD.estimated.lon, PAYLOAD.estimated.lat], zoom: 10.6, pitch: 0, bearing: 0, speed: 0.9, curve: 1.4, essential: true });
  await sleep(900);
  map.setPaintProperty('nodes-pt', 'circle-opacity', 1);
  map.setPaintProperty('nodes-pt', 'circle-stroke-opacity', 1);
  map.setPaintProperty('est-pt', 'circle-opacity', 1);
  map.setPaintProperty('est-pt', 'circle-stroke-opacity', 1);

  // Phase 2: initial estimate range (red, wide -- before refinement)
  setBadge('ESTIMATING LOCATION', 'red');
  readout.innerHTML = `<span class="bad">Initial estimate range:</span> ${PAYLOAD.semi_major_km.toFixed(1)} km &times; ${PAYLOAD.semi_minor_km.toFixed(1)} km -- accuracy before cross-checking against the nodes.`;
  await Promise.all([
    fadeLayer('ellipse-fill', 'fill-opacity', 0, 0.35, 700),
    fadeLayer('ellipse-line', 'line-opacity', 0, 0.9, 700)
  ]);
  await sleep(200);

  // Phase 3: each node's maximum possible range
  setBadge('CROSS-CHECKING NODES', 'red');
  readout.innerHTML = `<span class="dim">Checking the maximum possible distance from each node, based on its own timing.</span>`;
  await fadeLayer('circles-line', 'line-opacity', 0, 0.8, 500);
  await sleep(500);

  // Phase 4: snap red -> green, reveal the verified area
  setBadge('VERIFIED', 'green');
  await Promise.all([
    fadeLayer('ellipse-fill', 'fill-opacity', 0.35, 0, 500),
    fadeLayer('ellipse-line', 'line-opacity', 0.9, 0, 500),
    fadeLayer('circles-line', 'line-opacity', 0.8, 0, 500),
    fadeLayer('sector-fill', 'fill-opacity', 0, 0.55, 600),
    fadeLayer('sector-line', 'line-opacity', 0, 1, 600)
  ]);

  // Phase 5: final flat zoom-to-fit, framing the verified area cleanly on screen
  await sleep(150);
  map.fitBounds(sectorBounds(), {
    padding: { top: 90, bottom: 60, left: 60, right: 90 },
    maxZoom: 17,
    pitch: 0, bearing: 0, duration: 900, essential: true
  });
  await sleep(950);

  const areaTxt = PAYLOAD.verified_sector_area_km2 < 1
    ? (PAYLOAD.verified_sector_area_km2 * 1e6).toFixed(0) + ' m2'
    : PAYLOAD.verified_sector_area_km2.toFixed(2) + ' km2';
  readout.innerHTML = `<span class="ok">Verified</span> -- ${areaTxt} confirmed area<br>`
    + `Estimated location: ${PAYLOAD.estimated.lat.toFixed(4)}, ${PAYLOAD.estimated.lon.toFixed(4)}<br>`
    + `<span class="dim">This is the smallest area consistent with every node's timing data.</span>`;
  document.getElementById('btn-play').textContent = 'Play sequence';
}

document.getElementById('btn-play').onclick = () => {
  playSequence().catch(err => {
    readout.innerHTML = `<span class="bad">Something went wrong: ${err.message}</span>`;
    document.getElementById('btn-play').textContent = 'Play sequence';
  });
};
</script>
